name: Upstream Notcurses Update

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Check and test upstream update
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check upstream release
        id: upstream
        run: |
          set -euo pipefail
          CURRENT="$(cat .notcurses-version)"
          RELEASE="$(curl -fsSL https://api.github.com/repos/dankamongmen/notcurses/releases/latest)"
          TAG="$(echo "$RELEASE" | jq -r '.tag_name')"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unexpected upstream release tag: $TAG"
            exit 1
          fi
          LATEST="${BASH_REMATCH[1]}"
          echo "Installed version: ${CURRENT}"
          echo "Latest version: ${LATEST}"
          NEWEST="$(printf '%s\n%s\n' \
            "$CURRENT" "$LATEST" | sort -V | tail -n 1)"
          if [[ "$LATEST" == "$CURRENT" ||
                "$NEWEST" != "$LATEST" ]]; then
            echo "No newer upstream release."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "A new upstream release is available."
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "update=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.upstream.outputs.update == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            guile-3.0 \
            guile-3.0-dev \
            libncurses-dev \
            libunistring-dev \
            libdeflate-dev \
            pkg-config \
            python3

      - name: Update dependency version
        if: steps.upstream.outputs.update == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          printf '%s\n' "$VERSION" > .notcurses-version

      - name: Build upstream Notcurses
        if: steps.upstream.outputs.update == 'true'
        run: ./scripts/ci-build-notcurses

      - name: Precompile modules
        if: steps.upstream.outputs.update == 'true'
        run: ./scripts/precompile

      - name: Run tests
        if: steps.upstream.outputs.update == 'true'
        run: ./scripts/test

      - name: Create or update pull request
        if: steps.upstream.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="automation/notcurses-${VERSION}"
          TITLE="chore: update Notcurses to ${VERSION}"
          BODY="This PR updates the Notcurses dependency to ${VERSION}.

          The upstream library was built from its tagged release.

          The following checks passed:

          - Upstream compilation
          - Guile module precompilation
          - SRFI-64 test suite
          - Live PTY integration tests

          Please review the changes before merging."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .notcurses-version
          git commit -m "$TITLE"
          git push --force --set-upstream origin "$BRANCH"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
