name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            guile-3.0 \
            guile-3.0-dev \
            libncurses-dev \
            libunistring-dev \
            libdeflate-dev \
            pkg-config \
            python3

      - name: Build Notcurses
        run: ./scripts/ci-build-notcurses

      - name: Precompile Guile modules
        run: ./scripts/precompile

      - name: Run test suite
        run: ./scripts/test


  release:
    name: Publish release
    needs: test
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect package version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          changed=false
          if [[ ! "$BEFORE_SHA" =~ ^0+$ ]] &&
             git cat-file -e "${BEFORE_SHA}:guix.scm" 2>/dev/null; then
            PREV_VER="$(git show "${BEFORE_SHA}:guix.scm" | sed -n 's/^[[:space:]]*(version "\([^"]*\)").*/\1/p' | head -n 1)"
            CURR_VER="$(sed -n 's/^[[:space:]]*(version "\([^"]*\)").*/\1/p' guix.scm | head -n 1)"
            if [[ -n "$CURR_VER" && "$CURR_VER" != "$PREV_VER" ]]; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*(version "\([^"]*\)").*/\1/p' guix.scm | head -n 1)"
          NC_VERSION="$(cat .notcurses-version)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 0
          fi

          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "guile-notcurses ${VERSION} (Notcurses ${NC_VERSION})" --generate-notes
